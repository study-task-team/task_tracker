<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <title>{{ title }}</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.1/font/bootstrap-icons.css">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-primary mb-4">
        <div class="container">
            <a class="navbar-brand" href="/"><i class="bi bi-check2-square me-2"></i>Трекер задач</a>
            <div class="ms-auto">
                {% if role == 'teacher' %}
                    <span class="badge bg-warning text-dark me-2">Преподаватель</span>
                {% elif role == 'student' %}
                    <span class="badge bg-success me-2">Студент</span>
                {% endif %}
                {% if role != 'guest' %}
                    <a href="/logout" class="btn btn-outline-light btn-sm">Выйти</a>
                {% endif %}
            </div>
        </div>
    </nav>
    <main class="container pb-5">
        {% block content %}{% endblock %}
    </main>
</body>
</html>
